[package]
name = "mdviewer_core"
version = "1.0.0"
edition = "2021"
authors = ["DK"]
description = "Ultra-fast native core accelerator for mdviewer: library indexing, outline parsing, and markdown rendering"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.10"
walkdir = "2.5"
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }
regex = "1.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
